[project]
name = "llm-vuln-scanner"
version = "0.1.0"
description = "An automated vulnerability scanner for LLM applications, mapped to the OWASP Top 10 for LLM Applications 2026, the OWASP Top 10 for Agentic Applications 2026 and MITRE ATLAS v2026.10"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
keywords = ["llm", "security", "red-teaming", "prompt-injection", "owasp", "mitre-atlas", "sarif"]
dependencies = [
    "numpy>=2.5",
]

[project.optional-dependencies]
# Local Hugging Face models as targets: uv sync --extra transformers
transformers = [
    "torch>=2.15",
    "transformers>=5.22",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "pre-commit>=4.7",
]
# Rebuild the Rust core in place while editing it: make rust-develop
rust = [
    "maturin>=1.16,<2",
]
# Reference implementations used by the opt-in validation tests and the benchmarks.
validation = [
    "scikit-learn>=1.9",
    "jsonschema>=4.26",
]
# Converting the downloaded parquet datasets to JSONL.
data = [
    "pyarrow>=26",
]

[project.scripts]
llm-vuln-scanner = "llm_vuln_scanner.cli:main"

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

# The Rust core (rust/) is compiled into the package as `llm_vuln_scanner.lvs_rs`, so
# every install uses it; the Python implementations stay as the reference.
[tool.maturin]
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "llm_vuln_scanner.lvs_rs"
features = ["python"]
include = [{ path = "src/llm_vuln_scanner/data/*", format = ["sdist", "wheel"] }]

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/src/**/*.rs" }]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["llm_vuln_scanner"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "validation: compares against reference libraries (uv sync --group validation)",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/llm_vuln_scanner/targets/transformers_target.py"]
