name: Release wheels

# Builds abi3 wheels (CPython 3.12 and later) with the compiled Rust core for each platform,
# plus the sdist, as workflow artifacts; they are then attached to the GitHub release:
#   gh run download <run-id> -D dist && gh release upload <tag> dist/*/*
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, name: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, name: linux-aarch64 }
          - { runner: macos-latest, name: macos-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
      - name: Smoke test
        run: |
          uv venv /tmp/smoke --python 3.14
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/llm-vuln-scanner info
          /tmp/smoke/bin/llm-vuln-scanner scan --target naive --sample 1 --out /tmp/smoke-reports --quiet
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
