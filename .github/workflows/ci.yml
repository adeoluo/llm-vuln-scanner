name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, lint, type, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (builds the Rust core)
        run: uv sync --dev --group validation --python ${{ matrix.python-version }}

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy src

      - name: Test (+ coverage gate)
        env:
          LVS_REQUIRE_RUST: "1"
        run: uv run --no-sync pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  rust:
    name: rust core and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Format, lint and unit tests
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features python -- -D warnings
          cargo test

      - name: Build the package with its Rust core
        run: uv sync --dev --python 3.12

      - name: Parity tests (Rust versus Python)
        env:
          LVS_REQUIRE_RUST: "1"
        run: uv run --no-sync pytest tests/test_parity.py -v

  build:
    name: build (package and image)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build package
        run: uv build
      - name: Build Docker image
        run: docker build -t ${{ github.event.repository.name }}:ci .

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Scan the simulated vulnerable model (expect findings)
        id: vulnerable
        continue-on-error: true
        uses: ./
        with:
          target: naive
          sample: "2"
          fail-on: high
          upload-sarif: "false"
          output-dir: reports-naive

      - name: Scan the simulated refusing model (expect a clean pass)
        id: refusing
        uses: ./
        with:
          target: refusing
          sample: "2"
          fail-on: low
          upload-sarif: "false"
          output-dir: reports-refusing

      - name: Check exit codes and reports
        env:
          VULN: ${{ steps.vulnerable.outputs.exit-code }}
          CLEAN: ${{ steps.refusing.outputs.exit-code }}
        run: |
          test "$VULN" = "1"
          test "$CLEAN" = "0"
          test -s reports-naive/llm-vuln-scan.sarif
          python3 -c "import json; r = json.load(open('reports-naive/llm-vuln-scan.json')); assert r['summary']['vulnerable_probes'] > 0"
